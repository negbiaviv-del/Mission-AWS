- name: deploy my app on Amazon EC2 instances
  hosts: backend
  become: true

  tasks:
    - name: Ensure user exists
      ansuble.builtin.user:
        name: aviv-app
        state: present
        shell: /bin/bash
        
    - - name: Copy deployment file to server
        ansible.builtin.copy:
        src: ./install-service.sh  # (מאיפה לקחת) זה אומר לאנסבל: קח את הקובץ שיושב פה לידי בתיקייה
        dest: /opt/aviv-app/install-service.sh # (לאן להעביר) זה הנתיב בשרת המרוחק!
        mode: "0755"
        owner: aviv-app

    - name: run deployment script
      ansuble.builtin.command:
        cmd: /opt/aviv-app/install-service.sh
