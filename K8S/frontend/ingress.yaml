apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: devops-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - a3e78cec9507740208bc79e3085257ce-2029120698.us-east-1.elb.amazonaws.com
    secretName: mission-tls
  rules:
  - host: a3e78cec9507740208bc79e3085257ce-2029120698.us-east-1.elb.amazonaws.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8080
