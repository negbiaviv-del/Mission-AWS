apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: devops-app
  labels:
    app: worker
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker-sa
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        
      containers:
      - name: worker
        image: 544471418394.dkr.ecr.us-east-1.amazonaws.com/my-worker:v1.0
        
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
            
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
            
        # בדיקת תקינות חלופית (מכיוון שאין פורט פתוח ל-Worker)
        livenessProbe:
          exec:
            command:
            - ls
            - /app
          initialDelaySeconds: 5
          periodSeconds: 15
          
        readinessProbe:
          exec:
            command:
            - ls
            - /app
          initialDelaySeconds: 5
          periodSeconds: 10